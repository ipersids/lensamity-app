services:
  nginx:
    image: nginx:1.31-alpine
    container_name: nginx
    volumes:
      - ./infra/nginx/dev.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9000:9000"
      - "9001:9001"
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  app:
    build:
      context: ./client-web
      dockerfile: dev.Dockerfile
    container_name: app
    expose:
      - "${APP_PORT:-5173}"
    environment:
      VITE_BASE_API_URL: ${VITE_BASE_API_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${APP_PORT:-5173}').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./client-web/src:/usr/src/app/src
      - ./client-web/public:/usr/src/app/public
      - ./client-web/index.html:/usr/src/app/index.html
      - ./client-web/vite.config.ts:/usr/src/app/vite.config.ts
      - ./client-web/tsconfig.json:/usr/src/app/tsconfig.json
      - ./client-web/tsconfig.app.json:/usr/src/app/tsconfig.app.json
      - ./client-web/tsconfig.node.json:/usr/src/app/tsconfig.node.json
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-db}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-test}
    expose:
      - "${POSTGRES_PORT:-5432}"
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -p ${POSTGRES_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: build/dev/api.Dockerfile
    container_name: api
    environment:
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${RUSTFS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    command: ["air", "-c", "air.toml"]
    volumes:
      - ./server:/app
    expose:
      - "${API_PORT:-8080}"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:${API_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    expose:
      - "${RUSTFS_PORT:-9000}"
      - "${RUSTFS_CONSOLE_PORT:-9001}"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f ${RUSTFS_ENDPOINT_URL}/health && curl -f http://${RUSTFS_CONSOLE_ADDRESS}/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    environment:
      RUSTFS_ENDPOINT_URL: ${RUSTFS_ENDPOINT_URL}
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES}
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_REGION: ${RUSTFS_REGION}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS}
    volumes:
      - ./infra/rustfs/data:/data
      - ./infra/rustfs/logs:/logs

  # Manual repair helper for RustFS bind-mount permissions.
  # This service is hidden behind the "perms" profile, so normal `docker compose up`
  # will not run it. Use `just rustfs-perms` only if RustFS logs filesystem errors
  # such as "Permission denied", "EACCES", or "failed to write".
  rustfs_perms:
    image: alpine
    profiles:
      - perms
    user: root
    volumes:
      - ./infra/rustfs/logs:/logs
      - ./infra/rustfs/data:/data
    command: chown -R 10001:10001 /logs /data

volumes:
  data:
