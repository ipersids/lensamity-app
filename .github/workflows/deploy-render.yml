name: deploy-render
run-name: Deploy release on Render triggered by ${{ github.actor }}

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: release
        name: Resolve tag to its exact commit
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          COMMIT_SHA="$(git rev-parse "${VERSION}^{commit}")"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $VERSION at $COMMIT_SHA"
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: bash infra/scripts/deploy-render.sh
