name: quality-check
run-name: Running code quality check and tests by ${{ github.actor }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]
  workflow_call:

jobs:
  frontend_check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm@12.3.4
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Biome linter
        run: pnpm run lint
      - name: Run Biome format check
        run: pnpm run format:check

  backend_check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check Formatting
        run: |
          # If gofmt returns any file names, print them and exit with code 1
          FORMAT_ISSUES=$(gofmt -l .)
          if [ -n "$FORMAT_ISSUES" ]; then
            echo "The following files have formatting issues:"
            echo "$FORMAT_ISSUES"
            echo "Run 'go fmt ./...' locally to fix them."
            exit 1
          fi
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...

  production_image_check:
    name: Build production Docker image
    needs: [frontend_check, backend_check]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate production image build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./prod.Dockerfile
          push: false
          tags: lensamity:ci
